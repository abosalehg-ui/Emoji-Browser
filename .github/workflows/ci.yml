name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          # jsdom (used by the test environment) requires
          # ^22.22.2 || ^24.15.0 || >=26 — it fails to load on Node 20, which
          # GitHub is deprecating for runners anyway.
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run validate:data
      - run: npm test
      # Runtime dependencies are the ones that reach users, so any finding
      # there fails the build. Dev tooling fails on high/critical: it used to be
      # advisory-only (continue-on-error), which let known advisories sit
      # unnoticed. Dependabot (.github/dependabot.yml) opens the fix PRs.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=low
      - name: Audit dev dependencies
        run: npm audit --audit-level=high
